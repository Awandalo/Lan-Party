name: Configure approved Resend DNS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-resend-dns-lan-party-club
  cancel-in-progress: false

jobs:
  dns:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Awandalo/Lan-Party' &&
      github.ref == 'refs/heads/main' &&
      github.ref_type == 'branch' &&
      github.ref_protected == true &&
      github.workflow_ref == 'Awandalo/Lan-Party/.github/workflows/configure-resend-dns.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test DNS safety controls without credentials or network
        run: node --test .github/tests/resend-dns.test.mjs

      - name: Publish only the four approved records
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: node .github/scripts/resend-dns.mjs
