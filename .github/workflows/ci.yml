name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    # Keep the required check name/job identity; never skip the whole job.
    name: TypeScript and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Both the push comparison and historical compatibility fixture need history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate CI routing policy
        id: policy
        run: node --test scripts/ci-plan.test.mjs

      - name: Select conservative coverage
        id: plan
        run: node scripts/ci-plan.mjs plan "$RUNNER_TEMP/ci-plan.json"

      - name: Validate changed documentation
        id: docs
        if: steps.plan.outputs.mode == 'docs'
        run: node scripts/ci-plan.mjs docs "$RUNNER_TEMP/ci-plan.json"

      - name: Install dependencies
        id: install
        if: steps.plan.outputs.mode == 'frontend' || steps.plan.outputs.mode == 'full'
        run: npm ci

      - name: Validate public UI and frontend environment boundaries
        id: ui
        if: steps.plan.outputs.mode == 'frontend'
        run: node --test scripts/ci-public-ui.test.mjs worker/tests/auth-ui-mode.test.mjs

      # Miniflare creates disposable local D1 databases with fictional fixtures.
      - name: Validate database migrations and full regression
        id: regression
        if: steps.plan.outputs.mode == 'full'
        run: |
          node --test scripts/ci-public-ui.test.mjs
          node scripts/ci-plan.mjs regression "$RUNNER_TEMP/ci-plan.json"

      - name: Validate TypeScript
        id: types
        if: steps.plan.outputs.mode == 'frontend' || steps.plan.outputs.mode == 'full'
        run: npm run typecheck

      - name: Build production frontend
        id: build
        if: steps.plan.outputs.mode == 'frontend' || steps.plan.outputs.mode == 'full'
        # TypeScript already ran above; use the same Vite build without repeating tsc.
        run: npm exec -- vite build

      - name: Enforce selected coverage completion
        if: always()
        env:
          RESULT_POLICY: ${{ steps.policy.outcome }}
          RESULT_DOCS: ${{ steps.docs.outcome }}
          RESULT_INSTALL: ${{ steps.install.outcome }}
          RESULT_UI: ${{ steps.ui.outcome }}
          RESULT_REGRESSION: ${{ steps.regression.outcome }}
          RESULT_TYPES: ${{ steps.types.outcome }}
          RESULT_BUILD: ${{ steps.build.outcome }}
        run: node scripts/ci-plan.mjs verify "$RUNNER_TEMP/ci-plan.json"
