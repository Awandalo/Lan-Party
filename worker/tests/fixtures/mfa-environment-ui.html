<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional R3 availability fixture</title><div id="root"></div><output id="fixture-stats"></output>
<script type="module">
// Serve using local Vite. ?availability=no|yes|error|malformed&mfa=required
// All application API traffic is intercepted; no external services/accounts.
import React from 'react';import{createRoot}from'react-dom/client';import{BrowserRouter}from'react-router';
import AccountSecurity from '/src/pages/AccountSecurity.tsx';import{AuthProvider}from'/src/lib/auth.tsx';import'/src/CSS/main.css';
const availability=new URL(location.href).searchParams.get('availability')??'no';let mutations=0;
window.fetch=async(url,init={})=>{
 const path=new URL(url,location.href).pathname;
 if(init.method==='POST'){mutations++;document.getElementById('fixture-stats').textContent=`Fictional mutations: ${mutations}`;throw Error('Mutation blocked in availability-only fixture');}
 if(path==='/api/auth/session')return Response.json({account:{userId:'11111111-1111-4111-8111-111111111111',nickname:'Fictional fixture',memberNumber:'11'},emailVerified:true,csrfToken:'a'.repeat(64)});
 if(path==='/api/auth/security/methods')return Response.json({password:true});
 if(path==='/api/auth/mfa/status'){
  if(availability==='error')throw new TypeError('Fictional outage');
  return Response.json(availability==='malformed'?{enabled:true}:{enabled:availability!=='yes',enrollmentAvailable:availability==='yes'});
 }
 throw Error('External and unexpected requests blocked in R3 fixture');
};
document.getElementById('fixture-stats').textContent='Fictional mutations: 0';
createRoot(document.getElementById('root')).render(React.createElement(BrowserRouter,null,React.createElement(AuthProvider,null,React.createElement(AccountSecurity))));
</script></html>
